<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Déborah Oudin — Développeuse Full Stack | Portfolio React</title>
    <meta
      name="description"
      content="Portfolio de Déborah Oudin, développeuse Full Stack. Une scène de sorcière interactive pour explorer mes projets, compétences et univers créatif."
    />
    <!-- Validation de la propriété du site dans Google Search Console -->
    <meta
      name="google-site-verification"
      content="MOThkOZstYgJ5FUQgHeHM1IUaL8pBUi0SkVLo4YHvc4"
    />
    <!-- Images de fond déclarées en CSS : préchargées pour s'afficher sans attendre la feuille de style -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/background_website.webp"
      fetchpriority="high"
    />
    <!-- Le parchemin n'est pas utilisé sur tablette verticale et mobile -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/parchemin__welcome.webp"
      media="(min-width: 1025px) and (min-height: 501px), (min-width: 769px) and (orientation: landscape) and (min-height: 501px)"
    />
    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Déborah Oudin — Portfolio Développeuse Full Stack"
    />
    <meta
      property="og:description"
      content="Une scène de sorcière interactive pour explorer mes projets, compétences et univers créatif."
    />

    <meta
      property="og:url"
      content="https://oudin-deborah.github.io/Portfolio/"
    />
    <meta
      property="og:image"
      content="https://oudin-deborah.github.io/Portfolio/apercu_portfolio.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Une scène de sorcière interactive"
    />
    <meta property="og:type" content="website" />
    <!-- Grand aperçu d'image lors d'un partage (LinkedIn, X…) -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restauration de l'URL SPA pour GitHub Pages (contrepartie du script dans 404.html).
      // Décode l'URL encodée par 404.html et la réécrit proprement.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
