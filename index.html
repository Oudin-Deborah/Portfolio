  <body>
    <div id="root"></div>
    <script>
      // Restauration de l'URL SPA pour GitHub Pages (contrepartie du script dans 404.html).
      // Décode l'URL encodée par 404.html et la réécrit proprement.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
